# 法衡律鉴 - Nginx 反向代理（用于绑定域名 + 上 https）
# 用法：把本文件内容放到云服务器 /etc/nginx/conf.d/contract-review.conf
# 然后把你的域名解析到服务器公网 IP，再按部署指南申请证书。

server {
    listen 80;
    server_name your-domain.com;   # 改成你的备案域名

    client_max_body_size 30m;       # 允许上传大文件（合同 ≤20MB）

    location / {
        # 后端实际监听 8010（见 Dockerfile / backend/main.py）；此前误写 8000 会导致反代 502
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;     # OCR/大模型审查耗时较长
        proxy_send_timeout 300s;
    }
}
